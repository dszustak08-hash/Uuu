name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj zip
        run: for z in *.zip; do unzip -q "$z"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zbuduj APK
        run: gradle assembleDebug
        working-directory: Wyrownywacz
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrownywacz-apk
          path: Wyrownywacz/app/build/outputs/apk/debug/app-debug.apk
